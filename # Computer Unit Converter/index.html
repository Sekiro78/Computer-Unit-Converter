<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Unit Converter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');

        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
        }
        input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: 'Prompt', sans-serif;
            transition: border-color 0.3s;
        }
        input[type="number"]:focus, select:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px 20px;
            width: 100%;
            border-radius: 8px;
            font-size: 18px;
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:active {
            transform: scale(0.98);
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 2px dashed #3498db;
        }
        .result {
            font-size: 22px;
            font-weight: bold;
            color: #27ae60;
            word-wrap: break-word;
        }
        /* ส่วนของผู้จัดทำ */
        .creator {
            margin-top: 35px;
            padding: 15px;
            background: linear-gradient(to right, #2c3e50, #34495e);
            border-radius: 8px;
            color: #f1c40f;
            font-weight: 600;
            font-size: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            letter-spacing: 0.5px;
        }
        .creator span {
            color: #ffffff;
            font-weight: 400;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }
        .error-code {
            margin: 0 0 8px;
            color: #3498db;
            font-size: 76px;
            font-weight: 600;
            line-height: 1;
        }
        h1 {
            color: #2c3e50;
            font-size: 26px;
            margin: 0 0 12px;
        }
        .message {
            color: #64748b;
            margin: 0 0 28px;
        }
        .home-link {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            background-color: #3498db;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .home-link:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
<main class="container" aria-labelledby="error-title">
    <p class="error-code">404</p>
    <h1 id="error-title">ไม่พบหน้าที่คุณกำลังค้นหา</h1>
    <p class="message">ขออภัย หน้านี้อาจถูกย้าย ลบ หรือไม่มีอยู่ในระบบ</p>
    <a class="home-link" href="./">กลับไปหน้าหลัก</a>
</main>
</body>
</html>
