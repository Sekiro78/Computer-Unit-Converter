<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Unit Converter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');

        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
        }
        input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: 'Prompt', sans-serif;
            transition: border-color 0.3s;
        }
        input[type="number"]:focus, select:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px 20px;
            width: 100%;
            border-radius: 8px;
            font-size: 18px;
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:active {
            transform: scale(0.98);
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 2px dashed #3498db;
        }
        .result {
            font-size: 22px;
            font-weight: bold;
            color: #27ae60;
            word-wrap: break-word;
        }
        /* ส่วนของผู้จัดทำ */
        .creator {
            margin-top: 35px;
            padding: 15px;
            background: linear-gradient(to right, #2c3e50, #34495e);
            border-radius: 8px;
            color: #f1c40f;
            font-weight: 600;
            font-size: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            letter-spacing: 0.5px;
        }
        .creator span {
            color: #ffffff;
            font-weight: 400;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }
        .error-code {
            margin: 0 0 8px;
            color: #3498db;
            font-size: 76px;
            font-weight: 600;
            line-height: 1;
        }
        h1 {
            color: #2c3e50;
            font-size: 26px;
            margin: 0 0 12px;
        }
        .message {
            color: #64748b;
            margin: 0 0 28px;
        }
        .home-link {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            background-color: #3498db;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .home-link:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>โปรแกรมแปลงหน่วย<br>ความจุคอมพิวเตอร์</h2>

    <div class="input-group">
        <label for="inputValue">ระบุจำนวน:</label>
        <input type="number" id="inputValue" placeholder="กรอกตัวเลขที่นี่..." value="1" min="0" step="any">
    </div>

    <div class="input-group">
        <label for="fromUnit">แปลงจากหน่วย (From):</label>
        <select id="fromUnit">
            <option value="bit">Bit (b)</option>
            <option value="byte" selected>Byte (B)</option>
            <option value="kb">Kilobyte (KB)</option>
            <option value="mb">Megabyte (MB)</option>
            <option value="gb">Gigabyte (GB)</option>
            <option value="tb">Terabyte (TB)</option>
            <option value="pb">Petabyte (PB)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="toUnit">เป็นหน่วย (To):</label>
        <select id="toUnit">
            <option value="bit">Bit (b)</option>
            <option value="byte">Byte (B)</option>
            <option value="kb" selected>Kilobyte (KB)</option>
            <option value="mb">Megabyte (MB)</option>
            <option value="gb">Gigabyte (GB)</option>
            <option value="tb">Terabyte (TB)</option>
            <option value="pb">Petabyte (PB)</option>
        </select>
    </div>

    <div class="result-box">
        <div class="result" id="resultDisplay">ผลลัพธ์: 0.0009765625 KB</div>
    </div>

    <div class="creator">
        <span>ผู้จัดทำ</span>
        รัฐภูมิ ทรัพย์มีชัยCE6921
    </div>
</div>

<script>
    const rates = {
        "bit": 1 / 8,
        "byte": 1,
        "kb": 1024,
        "mb": Math.pow(1024, 2),
        "gb": Math.pow(1024, 3),
        "tb": Math.pow(1024, 4),
        "pb": Math.pow(1024, 5)
    };

    function convert() {
        const inputValue = parseFloat(document.getElementById('inputValue').value);
        const fromUnit = document.getElementById('fromUnit').value;
        const toUnit = document.getElementById('toUnit').value;
        const resultDisplay = document.getElementById('resultDisplay');

        if (isNaN(inputValue) || inputValue < 0) {
            resultDisplay.innerText = "กรุณากรอกตัวเลขที่ถูกต้อง";
            resultDisplay.style.color = "#e74c3c";
            return;
        }

        const result = inputValue * rates[fromUnit] / rates[toUnit];
        const formattedResult = result === 0
            ? "0"
            : result < 0.000001 || result > 1000000000
                ? result.toExponential(4)
                : result.toLocaleString('en-US', { maximumFractionDigits: 6 });
        const toUnitText = document.getElementById('toUnit').options[document.getElementById('toUnit').selectedIndex].text.split(' ')[0];

        resultDisplay.style.color = "#27ae60";
        resultDisplay.innerText = `${formattedResult} ${toUnitText}`;
    }

    document.getElementById('inputValue').addEventListener('input', convert);
    document.getElementById('fromUnit').addEventListener('change', convert);
    document.getElementById('toUnit').addEventListener('change', convert);
    window.onload = convert;
</script>
</body>
</html>
